<div class="profile-page">
  <div class="profile-card">
    <div class="card-accent"></div>

    <a routerLink="/" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
    </a>

    @if (user(); as u) {
      <div class="avatar-section">
        <img [src]="u.image" [alt]="u.firstName" class="avatar" />
        <h2>{{ u.firstName }} {{ u.lastName }}</h2>
        <p class="username">&#64;{{ u.username }}</p>
      </div>

      <div class="details">
        <div class="detail-item">
          <div class="detail-icon detail-icon--email">
            <mat-icon>email</mat-icon>
          </div>
          <div class="detail-info">
            <span class="detail-label">Email</span>
            <span class="detail-value">{{ u.email }}</span>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-icon detail-icon--user">
            <mat-icon>person</mat-icon>
          </div>
          <div class="detail-info">
            <span class="detail-label">Full Name</span>
            <span class="detail-value">{{ u.firstName }} {{ u.lastName }}</span>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-icon detail-icon--gender">
            <mat-icon>face</mat-icon>
          </div>
          <div class="detail-info">
            <span class="detail-label">Gender</span>
            <span class="detail-value">{{ u.gender }}</span>
          </div>
        </div>

        <div class="detail-item">
          <div class="detail-icon detail-icon--id">
            <mat-icon>badge</mat-icon>
          </div>
          <div class="detail-info">
            <span class="detail-label">User ID</span>
            <span class="detail-value">{{ u.id }}</span>
          </div>
        </div>
      </div>

      <button class="btn-logout" (click)="logout()">
        <mat-icon class="btn-icon">logout</mat-icon>
        Sign out
      </button>
    }
  </div>
</div>
