<div class="categories-container min-h-svh min-w-[14vw]">
  <h2 class="text-xl font-semibold text-gray-800 mb-4">Categories</h2>
  @if (loading()) {
    @for (_ of skeletonItems; track $index) {
      <div class="category-item category-skeleton">
        <div class="skeleton-checkbox"></div>
        <div class="category-info">
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line skeleton-slug"></div>
        </div>
      </div>
    }
  } @else {
    @for (category of categories(); track category.name) {
      <label class="category-item" [class.selected]="isSelected(category.name)">
        <div class="checkbox-wrapper">
          <input
            type="checkbox"
            [checked]="isSelected(category.name)"
            (change)="toggleCategory(category.name)"
          />
          <span class="checkmark"></span>
        </div>
        <div class="category-info">
          <span class="category-name">{{ category.name }}</span>
          <span class="category-slug">{{ category.slug }}</span>
        </div>
      </label>
    }
  }
  @if (selectedCategories().length > 0) {
    <div class="selected-bar">{{ selectedCategories().length }} selected</div>
  }
</div>
