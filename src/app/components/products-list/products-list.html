<div class="w-full container mx-auto">
  <div class="flex items-center justify-between pb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Products</h1>
      <p class="text-sm text-gray-400 mt-1">{{ products().length }} of {{ totalProducts() }} items</p>
    </div>
    <button
      (click)="toggleCategories()"
      class="lg:hidden flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:bg-gray-50"
    >
      <mat-icon class="text-lg">filter_list</mat-icon>
      Filters
    </button>
  </div>

  @if (showCategories()) {
    <div class="mb-4 lg:hidden">
      <app-categies-list (categoriesChanged)="filterByCategories($event)" />
    </div>
  }

  <div class="grid grid-cols-1 gap-4 p-2 sm:grid-cols-2 lg:grid-cols-3">
    @for (product of products(); track product.id ?? $index) {
      <a routerLink="/product-details/{{ product.id }}">
        <app-product-card [product]="product" />
      </a>
    }

    @if (loading() || loadingNext()) {
      @for (_ of skeletonItems(); track $index) {
        <app-skelton-product-card />
      }
    }
  </div>

  @if (!hasMore()) {
    <p class="text-center text-sm text-gray-400 py-8">No more products</p>
  }
</div>
