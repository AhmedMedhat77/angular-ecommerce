<div #scrollContainer class="products-scroll">
  <div class="products-inner">
    <div class="products-toolbar">
      <div>
        <h1 class="products-title">Products</h1>
        <p class="products-subtitle">{{ products().length }} of {{ totalProducts() }} items</p>
      </div>
      <button
        (click)="toggleCategories()"
        class="filter-toggle"
      >
        <mat-icon class="text-lg">filter_list</mat-icon>
        <span>Filters</span>
      </button>
    </div>

    @if (showCategories()) {
      <div class="mobile-categories lg:hidden">
        <app-categies-list (categoriesChanged)="filterByCategories($event)" />
      </div>
    }

    <div class="products-grid">
      @for (product of products(); track product.id ?? $index) {
        <a routerLink="/product-details/{{ product.id }}">
          <app-product-card [product]="product" />
        </a>
      }

      @if (loading() || loadingNext()) {
        @for (_ of skeletonItems(); track $index) {
          <app-skelton-product-card />
        }
      }
    </div>

    @if (!hasMore()) {
      <p class="products-end">No more products</p>
    }
  </div>
  <div #sentinel class="scroll-sentinel"></div>
</div>
