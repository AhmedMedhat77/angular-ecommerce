<nav class="sticky top-0 z-50 bg-gradient-to-r from-indigo-600 to-indigo-700 shadow-md">
  <div class="flex items-center justify-between px-6 py-3">
    <a [routerLink]="'/'" class="flex items-center gap-2.5" (click)="closeMenu()">
      <img src="logo.svg" alt="Logo" class="h-8 w-8 rounded-lg" />
      <span class="text-xl font-bold text-white">ShopFlow</span>
    </a>

    <div class="hidden items-center gap-3 md:flex">
      <app-search (searchValue)="onSearch($event)" />
      <a routerLink="/login" class="text-white">
        <mat-icon>account_circle</mat-icon>
      </a>
      <a routerLink="/cart">
        <app-app-cart />
      </a>
    </div>

    <div class="flex items-center gap-3 md:hidden">
      <a routerLink="/login" class="text-white">
        <mat-icon>account_circle</mat-icon>
      </a>
      <a routerLink="/cart" class="text-white">
        <app-app-cart />
      </a>
      <button
        (click)="toggleMenu()"
        class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg text-white transition-colors hover:bg-white/15"
      >
        @if (menuOpen()) {
          <mat-icon>close</mat-icon>
        } @else {
          <mat-icon>menu</mat-icon>
        }
      </button>
    </div>
  </div>

  <div class="overflow-hidden transition-all duration-300 ease-in-out md:hidden">
    @if (menuOpen()) {
      <div class="border-t border-white/10 px-6 py-4">
        <div class="mb-4">
          <app-search (searchValue)="onSearch($event)" />
        </div>
        <ul class="flex flex-col gap-1">
          @for (item of navItems; track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="nav-active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="closeMenu()"
                class="block rounded-lg px-4 py-2.5 text-sm font-medium text-indigo-100 transition-colors duration-200 hover:bg-white/15 hover:text-white"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </div>
</nav>
