<nav
  class="sticky top-0 z-50 flex items-center justify-between bg-gradient-to-r from-indigo-600 to-indigo-700 px-6 py-3 shadow-md"
>
  <a [routerLink]="'/'" class="flex items-center gap-2.5">
    <img src="logo.svg" alt="Logo" class="h-8 w-8 rounded-lg" />
    <span class="text-xl font-bold text-white">ShopFlow</span>
  </a>

  <ul class="flex items-center gap-1">
    @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="nav-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-4 py-2 text-sm font-medium text-indigo-100 transition-colors duration-200 hover:bg-white/15 hover:text-white"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>

  <div class="flex items-center gap-3">
    <app-search (searchValue)="onSearch($event)" />
    <a routerLink="/cart">
      <app-app-cart />
    </a>
  </div>
</nav>
