<div class="rounded-2xl border border-gray-200 bg-white p-6 flex flex-col gap-5 sticky top-24">
  <h2 class="text-lg font-bold text-gray-900">Order summary</h2>

  <div class="flex flex-col gap-3 text-sm">
    <div class="flex justify-between text-gray-600">
      <span>Subtotal ({{ totalItems() }} items)</span>
      <span class="font-medium">${{ originalTotal() }}</span>
    </div>
    @if (totalSavings() > 0) {
      <div class="flex justify-between text-emerald-600">
        <span class="flex items-center gap-1">
          <mat-icon class="text-base">local_offer</mat-icon>
          Discount
        </span>
        <span class="font-medium">-${{ totalSavings().toFixed(2) }}</span>
      </div>
    }
    <div class="flex justify-between text-gray-600">
      <span>Shipping</span>
      <span class="font-medium text-emerald-600">Free</span>
    </div>

    <div class="border-t border-gray-200 pt-3 mt-1">
      <div class="flex justify-between items-baseline">
        <span class="text-base font-bold text-gray-900">Total</span>
        <span class="text-xl font-bold text-purple-700">${{ totalPrice().toFixed(2) }}</span>
      </div>
    </div>
  </div>

  <a
    [routerLink]="'/checkout'"
    class="w-full bg-purple-700 hover:bg-purple-800 text-white font-semibold py-3 px-4 rounded-xl transition-colors duration-200 flex items-center justify-center"
  >
    Proceed to checkout
  </a>

  <button
    (click)="clearCart.emit()"
    class="w-full border border-gray-300 text-gray-500 hover:text-red-500 hover:border-red-300 font-medium py-2.5 px-4 rounded-xl transition-colors duration-200 cursor-pointer flex items-center justify-center gap-1.5"
  >
    <mat-icon class="text-base">delete_outline</mat-icon>
    Clear cart
  </button>
</div>
